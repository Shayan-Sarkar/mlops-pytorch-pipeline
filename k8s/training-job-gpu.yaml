apiVersion: batch/v1
kind: Job
metadata:
  name: model-training-gpu
  namespace: ml-training
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /app/configs/training_config.yaml
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
            - name: data-volume
              mountPath: /app/data
            - name: checkpoint-volume
              mountPath: /app/checkpoints
      volumes:
        - name: config-volume
          configMap:
            name: training-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: training-data-pvc
        - name: checkpoint-volume
          persistentVolumeClaim:
            claimName: model-checkpoints-pvc
